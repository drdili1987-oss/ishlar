<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ishlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="loading" id="viewLoading"><div class="spin" aria-label="Yuklanmoqda"></div></div>

<section class="login" id="viewLogin" hidden>
  <div class="login-card">
    <div class="brand big"><span class="dots"><i></i><i></i><i></i></span>Ishlar</div>
    <p>Jamoa vazifalari, loyihalar va muddatlar — bitta joyda. Davom etish uchun Google hisobingiz bilan kiring.</p>
    <div id="gsiBtn" class="gsi-slot"></div>
    <button class="btn gbtn" id="googleBtn" type="button" hidden><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Google bilan kirish</button>
    <div class="err" id="loginErr" role="alert"></div>
  </div>
</section>

<div id="viewApp" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-top"><button class="icon-btn light" id="sideToggle" aria-label="Menyuni yopish">☰</button><div class="brand"><span class="dots"><i></i><i></i><i></i></span>Ishlar</div></div>
    <button class="create" id="createBtn"><span>+</span> Yaratish</button>
    <nav class="nav">
      <a href="#/home" data-nav="home">⌂ <span>Bosh sahifa</span></a>
      <a href="#/my" data-nav="my">✓ <span>Mening vazifalarim</span></a>
      <a href="#/inbox" data-nav="inbox">✉ <span>Kiruvchi</span><b class="badge" id="inboxBadge" hidden></b></a>
    </nav>
    <div class="side-h"><span>Loyihalar</span><button class="icon-btn light" id="newProjectBtn" aria-label="Yangi loyiha">+</button></div>
    <nav class="nav" id="projectNav"></nav>
    <div class="side-me">
      <div class="menu" id="meMenu" hidden><button id="logoutBtn">Chiqish</button></div>
      <button class="me" id="meBtn" aria-label="Profil"><span id="meAv"></span><span id="meWho" class="me-who"></span><span class="me-dots">⋯</span></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="sideOpen" aria-label="Menyu">☰</button>
      <div class="search"><input id="searchInput" type="search" placeholder="Qidirish" autocomplete="off"><div class="search-res" id="searchRes" hidden></div></div>
    </header>
    <div class="content" id="content"></div>
  </div>
  <aside class="pane" id="pane" hidden></aside>
</div>

<div class="modal-back" id="modal" hidden><div class="modal" role="dialog" aria-modal="true" id="modalBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js?v=1"></script>
<script src="app.js?v=3"></script>
</body>
</html>
